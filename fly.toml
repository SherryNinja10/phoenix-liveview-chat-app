# fly.toml app configuration file generated for phoenix-chatapp on 2026-10-03T22:08:28-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'phoenix-chatapp'
primary_region = 'sjc'
kill_signal = 'SIGTERM'

[build]
[env]
  DATABASE_PATH = '/data/chat_app.db'
  PHX_HOST = 'phoenix-chatapp.aarshvandal.com'
  PORT = '8080'

[[mounts]]
  source = 'chat_data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
